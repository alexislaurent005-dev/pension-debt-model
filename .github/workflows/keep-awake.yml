name: keep streamlit app awake

# Streamlit Community Cloud sleeps apps after ~12h without real browser traffic.
# A plain HTTP ping doesn't count, so this opens the app in a headless browser
# and clicks the wake-up button if the app has gone to sleep.

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  actions: write   # needed by the keepalive step below

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://alexislaurent-pension-debt-model.streamlit.app/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app and wake it if asleep
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(10_000)

              wake = page.get_by_role("button", name="get this app back up")
              if wake.count() > 0:
                  print("App was asleep - clicking wake button")
                  wake.first.click()
                  page.wait_for_timeout(60_000)  # give it time to boot
              else:
                  print("App was awake - visit registered")
                  page.wait_for_timeout(20_000)  # stay long enough to count as a session
              browser.close()

      # GitHub switches off scheduled workflows in repos with no commits for
      # 60 days. This re-enables the schedule via the API, without making commits.
      - uses: liskin/gh-workflow-keepalive@v1
